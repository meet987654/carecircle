services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carecircle
      POSTGRES_PASSWORD: carecircle
      POSTGRES_DB: carecircle
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carecircle"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://carecircle:carecircle@db:5432/carecircle
      TEST_DATABASE_URL: postgresql+psycopg://carecircle:carecircle@db:5432/carecircle_test
      # Signs login sessions. Set your own long random value outside local demos.
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-me}
      # Optional LLM. Leave unset to use the built-in template assistant.
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-template}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.8-27b}
      # Voice agent: Whisper speech-to-text uses the same key as the LLM.
      STT_MODEL: ${STT_MODEL:-whisper-large-v3-turbo}
      # Who speaks answers: browser (default) or deepgram (Aura voices, needs DEEPGRAM_API_KEY).
      TTS_PROVIDER: ${TTS_PROVIDER:-browser}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      TTS_VOICE: ${TTS_VOICE:-aura-2-thalia-en}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
