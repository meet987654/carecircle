server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Required for SSE: pass each event through as soon as the API writes it.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    # Voice questions are uploaded as audio (a few seconds is ~50 KB; the API caps at 5 MB).
    client_max_body_size 6m;
  }

  location / {
    try_files $uri /index.html;
  }
}
